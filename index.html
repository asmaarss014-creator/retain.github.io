<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dara Parts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1050px;margin:auto;padding:28px 18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{margin:0;font-size:29px}.sub{color:#6b7688}.badge{background:#eaf0ff;color:#3157c9;padding:7px 12px;border-radius:20px;font-weight:700;font-size:12px}
.panel,.card{background:#fff;border:1px solid #e2e7ef;border-radius:18px;box-shadow:0 8px 28px #1720330b}.panel{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{position:relative}label{display:block;font-size:12px;font-weight:800;color:#566277;margin:0 0 7px}
input{width:100%;padding:14px;border:1px solid #d6dce7;border-radius:12px;font-size:15px;outline:0}input:focus{border-color:#6d84e8;box-shadow:0 0 0 4px #6d84e81a}
.suggest{display:none;position:absolute;left:0;right:0;top:69px;background:white;border:1px solid #dce2ed;border-radius:12px;overflow:hidden;z-index:5;box-shadow:0 14px 30px #17203318}.suggest div{padding:11px 13px;cursor:pointer}.suggest div:hover{background:#f0f3fb}
.actions{margin-top:15px;display:flex;gap:9px}button{padding:12px 18px;border:0;border-radius:11px;font-weight:800;cursor:pointer}#go{background:#3157c9;color:#fff}#clear{background:#eef1f6;color:#39465b}
.results{display:grid;gap:12px;margin-top:18px}.empty{text-align:center;color:#738095;padding:35px}.card{padding:17px}.top{display:flex;justify-content:space-between}.name{font-size:18px;font-weight:850}.id{font-size:12px;color:#778297}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.chip{background:#f0f3f8;padding:6px 9px;border-radius:8px;font-size:12px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.details b{display:block;color:#7a8495;font-size:10px;text-transform:uppercase}.note{margin-top:11px;color:#596579;font-size:13px}@media(max-width:700px){.grid,.details{grid-template-columns:1fr}header{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><main class="app"><header><div><h1>Dara Parts Database</h1><div class="sub">Fast local laptop & PC parts search</div></div><div class="badge">OFFLINE</div></header>
<section class="panel"><div class="grid"><div class="field"><label>PART NAME</label><input id="name" placeholder="Start typing: motherboard..." autocomplete="off"><div id="suggest" class="suggest"></div></div><div class="field"><label>PART NUMBER / MODEL / UNIQUE ID</label><input id="code" placeholder="LA-A992P, T480, 000001"></div></div><div class="actions"><button id="go">Search parts</button><button id="clear">Clear</button></div></section>
<section id="results" class="results"><div class="panel empty">Loading database…</div></section></main>
<script>
let names=[],rows=[];const N=document.querySelector('#name'),C=document.querySelector('#code'),S=document.querySelector('#suggest'),R=document.querySelector('#results');
function parse(t){return t.trim().split(/\n\s*\n/).map(b=>{let o={};b.split(/\r?\n/).forEach(l=>{let i=l.indexOf('=');if(i>0)o[l.slice(0,i).trim()]=l.slice(i+1).trim()});return o}).filter(o=>o.PART_ID)}
async function load(){try{names=(await(await fetch('parts_names.txt')).text()).split(/\r?\n/).filter(Boolean);rows=parse(await(await fetch('parts_data.txt')).text());R.innerHTML='<div class="panel empty">Search for a part.</div>'}catch(e){R.innerHTML='<div class="panel empty">Use a local web server to load the TXT database.</div>'}}
N.oninput=()=>{let q=N.value.trim().toLowerCase();S.innerHTML='';if(!q){S.style.display='none';return}names.filter(x=>x.toLowerCase().startsWith(q)).slice(0,8).forEach(x=>{let d=document.createElement('div');d.textContent=x;d.onclick=()=>{N.value=x;S.style.display='none'};S.appendChild(d)});S.style.display=S.children.length?'block':'none'};
document.onclick=e=>{if(!e.target.closest('.field'))S.style.display='none'};
function search(){let a=N.value.trim().toLowerCase(),b=C.value.trim().toLowerCase();let out=rows.filter(x=>(!a||x.PART_NAME.toLowerCase().includes(a))&&(!b||Object.values(x).some(v=>String(v).toLowerCase().includes(b))));R.innerHTML=out.length?out.map(x=>`<article class="card"><div class="top"><div><div class="name">${x.PART_NAME||'Part'}</div><div class="id">ID ${x.PART_ID}</div></div><b>${x.YEAR||''}</b></div><div class="chips"><span class="chip">${x.BRAND||'Unknown brand'}</span><span class="chip">${x.MODEL||'Unknown model'}</span><span class="chip">${x.PART_NUMBER||'No part number'}</span></div><div class="details"><div><b>Type</b>${x.TYPE||'—'}</div><div><b>RAM</b>${x.RAM||'—'}</div><div><b>Storage</b>${x.STORAGE||'—'}</div><div><b>Platform</b>${x.CPU_PLATFORM||'—'}</div><div><b>Condition</b>${x.CONDITION||'—'}</div><div><b>Compatibility</b>${x.COMPATIBILITY||'—'}</div></div><div class="note">${x.NOTES||''}</div></article>`).join(''):'<div class="panel empty">No matching parts found.</div>'}
document.querySelector('#go').onclick=search;document.querySelector('#clear').onclick=()=>{N.value='';C.value='';R.innerHTML='<div class="panel empty">Search cleared.</div>'};C.onkeydown=e=>{if(e.key==='Enter')search()};load();
</script></body></html>
